[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bhasaha-census"
version = "0.1.0"
requires-python = ">=3.11"
description = "KYC/Census automation MVP via Telegram and AI agents"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot>=21,<22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["apps*", "services*", "shared*", "kyc_bot*"]
